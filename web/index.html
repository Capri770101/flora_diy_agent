<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>花艺智能体 · 预览</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <header class="app-bar">
      <div class="title">🌸 花艺顾问</div>
      <div class="sub">说一句需求，生成专属方案与效果图</div>
    </header>

    <div id="messages" class="messages">
      <div class="bubble bot">
        你好，我是花艺顾问。告诉我你想做什么花、送给谁、什么风格和预算，我来帮你设计～
      </div>
    </div>

    <div class="examples">
      <span class="chip" data-q="想给我妈做个生日花束，她喜欢淡紫色，温柔一点，不要玫瑰，预算150左右，放在客厅茶几上">生日·淡紫·母亲</span>
      <span class="chip" data-q="闺蜜乔迁，想要高级感的花盒，蓝白色系，预算200">乔迁·高级·花盒</span>
      <span class="chip" data-q="给自己做个清新极简的瓶花放办公桌，预算80">办公桌·极简·瓶花</span>
    </div>

    <div class="input-bar">
      <input id="input" type="text" placeholder="例如：送给妈妈的温柔生日花束…" />
      <button id="send">发送</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
